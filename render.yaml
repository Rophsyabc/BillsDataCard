services:
  - type: web
    name: billsdatacard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: APP_URL
        value: https://billsdatacard.onrender.com
      - key: VITE_API_URL
        value: https://billsdatacard.onrender.com
      - key: ALLOWED_ORIGIN
        value: https://billsdatacard.onrender.com
      - key: ADMIN_EMAILS
        value: soardev.nath@gmail.com
      - key: ADMIN_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RELOADLY_ENV
        value: production
      - key: RELOADLY_PROD_CLIENT_ID
        sync: false
      - key: RELOADLY_PROD_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
